version: '3.8'

services:
  backend:
    build: ./backend
    container_name: pilgrims-crm-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - backend_data:/app/uploads
      - backend_db:/app/data
    networks:
      - crm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pilgrims-crm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - crm-network

volumes:
  backend_data:
  backend_db:

networks:
  crm-network:
    driver: bridge
